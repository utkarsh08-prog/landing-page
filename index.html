<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redirecting…</title>
    <!-- Redirect root to old.html so visiting the site opens old.html directly -->
    <meta http-equiv="refresh" content="0; url=old.html">
    <script>
      // Fallback redirect for browsers that ignore meta-refresh
      window.location.replace('old.html');
    </script>
  </head>
  <body>
    <p>Redirecting to <a href="old.html">old.html</a> — if you are not redirected automatically, click the link.</p>
  </body>
</html>
